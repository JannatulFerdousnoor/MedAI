<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Records | MedAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f9; padding: 50px 10%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { text-decoration: none; color: #4facfe; font-weight: bold; border: 1px solid #4facfe; padding: 10px 20px; border-radius: 8px; }
        .record-card { background: white; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-left: 6px solid #4facfe; }
        .record-card h3 { color: #333; margin-bottom: 10px; }
        .record-card p { color: #666; line-height: 1.6; white-space: pre-wrap; }
        .date { font-size: 12px; color: #999; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="color: #2d3436;">🕒 আপনার সকল স্বাস্থ্য রেকর্ড</h1>
        <a href="/" class="back-btn">← হোমে ফিরে যান</a>
    </div>
    {% for record in records %}
    <div class="record-card">
        <span class="date">আইডি: #{{ record.id }}</span>
        <h3>জিজ্ঞাসা: {{ record.symptoms }}</h3>
        <hr style="margin: 15px 0; opacity: 0.1;">
        <p><strong>এআই পরামর্শ:</strong><br>{{ record.diagnosis }}</p>
    </div>
    {% else %}
    <p style="text-align: center; color: #999;">কোনো তথ্য জমা নেই।</p>
    {% endfor %}
</body>
</html>
